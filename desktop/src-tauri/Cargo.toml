[package]
name = "interstellar-observatory"
version = "0.1.0"
description = "A relativistic observatory"
authors = ["Boyu"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "interstellar_observatory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
